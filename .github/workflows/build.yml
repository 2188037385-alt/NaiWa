name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with the C# compiler that ships with Windows
        shell: powershell
        run: .\build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: NaiWa
          path: dist/NaiWa.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NaiWa.exe
          generate_release_notes: true
